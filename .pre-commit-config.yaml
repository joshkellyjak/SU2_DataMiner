repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.13
  hooks:
    # Run the linter.
    - id: ruff-check
      name: Trailing whitespaces
      args: [ --fix, --select=W291]
    - id: ruff-check
      name: Unused modules
      args: [ --fix, --select=F401]
    - id: ruff-check
      name: Unused variables
      args: [--select=F841]
    - id: ruff-check
      name: Duplicate class members
      args: [--select=PIE794]
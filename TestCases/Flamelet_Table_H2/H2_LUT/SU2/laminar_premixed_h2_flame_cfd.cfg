%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER = INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
%MATH_PROBLEM= DIRECT
RESTART_SOL= NO
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= FLAMELET
INC_ENERGY_EQUATION = YES
INC_DENSITY_INIT= 1.00
INC_VELOCITY_INIT= (1.13, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 300.0
THERMODYNAMIC_PRESSURE= 101325
INC_NONDIM= DIMENSIONAL
%
% -------------------- FLUID MODEL --------------------------------------- %
%
FLUID_MODEL= FLUID_FLAMELET
VISCOSITY_MODEL= FLAMELET
CONDUCTIVITY_MODEL= FLAMELET
DIFFUSIVITY_MODEL= FLAMELET
KIND_SCALAR_MODEL= FLAMELET
INTERPOLATION_METHOD= LUT
FILENAMES_INTERPOLATOR= LUT_H2.drg
CONTROLLING_VARIABLE_NAMES= (ProgressVariable, EnthalpyTot)
CONTROLLING_VARIABLE_SOURCE_NAMES = (ProdRateTot_PV, NULL)
PREFERENTIAL_DIFFUSION= YES
% -------------------- SCALAR TRANSPORT ---------------------------------------%
%
% Using an artificial spark to ignite the solution at some location and iteration
%FLAME_INIT_METHOD= NONE
FLAME_INIT_METHOD= SPARK 
% Spark parameters in order:
% x-location of spark center (m)
% y-location of spark center (m)
% z-location of spark center (m)
% Spark radius (m)
% Iteration at which the artificial spark starts
% Spark iteration duration
SPARK_INIT= (0.001, 0.0004, 0, 5e-4, 10, 10)

% Controlling variable source terms applied within the spark sphere for the spark
% duration.
SPARK_REACTION_RATES= (1000, 0, 0)

SPECIES_INIT = (-5.749237e-01, 2.262913e+03, 1.446752e-02)

% Passive reactants in flamelet problem 

SPECIES_CLIPPING= YES
SPECIES_CLIPPING_MIN= -3.0218506726519462e-01 -3.4189892249024720e+06 5.0400935974812518e-03
SPECIES_CLIPPING_MAX= 6.9781493273663942e-01 9.7038201751467900e+05 2.8522387527619465e-02
% -2.651331e-01, 2.262913e+03, 1.446752e-02
MARKER_INLET_SPECIES = (inlet, -5.749237e-01, 2.262913e+03, 1.446752e-02)
LOOKUP_NAMES=MolarWeightMix, Conductivity, Cp, Heat_Release, DiffusionCoefficient
USER_SCALAR_NAMES= (Y-H2O)
USER_SOURCE_NAMES = ( \
     Y_dot_pos-H2O, Y_dot_neg-H2O
)
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_ISOTHERMAL= (burner_wall, 300, hex_wall, 300)
MARKER_SYM= (sides)
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET = (inlet, 300.000, 0.575, 1.0, 0.0, 0.0)
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_SPECIES_STRONG_BC= (inlet, outlet, burner_wall, hex_wall)
MARKER_OUTLET= (outlet, 0.0)
MARKER_ANALYZE_AVERAGE = AREA

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 10
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.95, 1.01, 10.0, 50.0, 1E-4, 1000)
ITER=50000
OUTPUT_WRT_FREQ= 1000
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER=20
%
% -------------------- FLOW AND SPECIES NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
CONV_NUM_METHOD_SPECIES= BOUNDED_SCALAR
MUSCL_FLOW= YES
MUSCL_SPECIES= YES
SLOPE_LIMITER_FLOW = NONE
SLOPE_LIMITER_SPECIES= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_SPECIES= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD = RMS_EnthalpyTot
CONV_RESIDUAL_MINVAL= -7
CONV_STARTITER= 20
SCREEN_OUTPUT = INNER_ITER RMS_PRESSURE RMS_ProgressVariable RMS_EnthalpyTot RMS_MixtureFraction
HISTORY_OUTPUT = ITER WALL_TIME RMS_RES LINSOL AVG_CFL
VOLUME_OUTPUT = SOLUTION, PRIMITIVE, SOURCE, RESIDUAL, SENSITIVITY, LOOKUP, TIMESTEP, RANK

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FORMAT= SU2
MESH_FILENAME = 2Dhex_BL.su2
OUTPUT_FILES = (RESTART,PARAVIEW)
TABULAR_FORMAT = CSV
CONV_FILENAME= history
VOLUME_FILENAME= flow


